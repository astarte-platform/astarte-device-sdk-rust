name: e2e-test
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CI: "true"
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  NEXTEST_PROFILE: "ci"
  MAIN_CRATE: "astarte-device-sdk"
  EXPORT_FOR_CI: "true"
jobs:
  e2e-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Create Astarte Cluster
        id: astarte
        uses: astarte-platform/astarte-cluster-action@0e7096af11e8dc42ecdeaca04467bfdbd3f6ef46
        with:
          astarte_version: 1.4.0-rc.4
          astarte_chart_version: 26.7.0-rc.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: ./scripts/ci/e2e-test.sh
      - run: ./scripts/ci/run-examples.sh
      - run: ./scripts/offline/run-test-offline.sh
      - name: post
        if: ${{ failure() || cancelled() }}
        run: ./scripts/ci/e2e-post.sh 'astarte'
